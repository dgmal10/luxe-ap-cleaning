<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente do Fundo Liquid Glass -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="40%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <!-- Borda Specular Glass com Ouro -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#F5D77F" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#C4A265" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5D77F" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Gradiente Ouro Metálico Vibrante -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="25%" stop-color="#FAD02C"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#FAD02C"/>
    </linearGradient>

    <!-- Reflexo Superior de Vidro Líquido -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Radial de Fundo -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="liquidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo Dark Profundo -->
  <rect width="64" height="64" rx="16" fill="url(#glassBg)"/>
  
  <!-- Glow Dourado Central -->
  <circle cx="32" cy="34" r="26" fill="url(#centerGlow)"/>

  <!-- Brilho de Vidro Líquido (Gloss Dome) -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 48 0 C 56.84 0 64 7.16 64 16 L 64 24 C 40 32 24 32 0 24 Z" fill="url(#glassGloss)"/>

  <!-- Borda de Vidro e Ouro -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#glassBorder)" stroke-width="1.6"/>

  <!-- Letra L Dourada 3D em Alta Definição -->
  <text x="32" y="46" text-anchor="middle" fill="url(#goldMetallic)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-0.5" filter="url(#liquidShadow)">L</text>

  <!-- Brilho Cintilante no Topo -->
  <circle cx="49" cy="15" r="1.5" fill="#FFFFFF" opacity="0.95"/>
  <path d="M49 10 L49 20 M44 15 L54 15" stroke="#FFF5C0" stroke-width="0.9" opacity="0.75"/>
</svg>
